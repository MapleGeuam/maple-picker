<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>메이플 직업 무작위 뽑기 Pro</title>

    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="직업 룰렛">
    <link rel="apple-touch-icon" href="img/물음표.png">

    <style>
        /* 기본(라이트) 테마 변수 */
        :root {
            --main-color: #f39c12;
            --stop-color: #e74c3c;
            --bg-color: #f5f6fa;
            --box-bg: #ffffff;
            --text-color: #2c3e50;
            --text-muted: #aaa;
            --display-bg: #fffcf5;
            --border-color: #eee;
            --log-border: #f5f5f5;
        }

        /* 다크 모드 테마 변수 */
        body.dark-mode {
            --bg-color: #1e1e24;
            --box-bg: #2b2b36;
            --text-color: #e0e0e0;
            --text-muted: #888;
            --display-bg: #22222a;
            --border-color: #444;
            --log-border: #3c3c4a;
        }

        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
            /* 아이폰 터치 시 파란 하이라이트 박스 제거 */
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            background: var(--box-bg);
            padding: 20px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 90%;
            max-width: 420px;
            box-sizing: border-box;
            position: relative;
            transition: background-color 0.3s ease;
        }

        /* 다크모드 토글 버튼 */
        #theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
            box-shadow: none;
            color: var(--text-color);
        }

        h1 {
            color: var(--main-color);
            margin: 0 0 5px 0;
            font-size: 24px;
        }

        #counter {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 15px;
        }

        #display-box {
            height: 280px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 25px 0 35px 0;
            border: 2px dashed var(--border-color);
            border-radius: 20px;
            margin-bottom: 20px;
            background: var(--display-bg);
            overflow: hidden;
            position: relative;
            box-sizing: border-box;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        #job-img {
            width: 140px;
            height: 140px;
            object-fit: contain;
            display: none;
            filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.1));
            animation: fadeIn 0.3s ease-out;
        }

        #job-name {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 5px;
        }

        /* 룰렛 텍스트 박스 */
        #roulette-box {
            font-size: 18px;
            font-weight: bold;
            width: 100%;
            display: none;
            overflow: hidden;
            white-space: nowrap;
            margin-top: 25px;
            position: relative;
        }

        .rotating-question {
            display: inline-block;
            white-space: nowrap;
            animation: infiniteLoop 5s linear infinite;
            will-change: transform;
        }

        .rotating-question span {
            display: inline-block;
            padding: 0 15px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 12px;
            transition: 0.2s;
            flex: 1;
        }

        #action-btn {
            background: var(--main-color);
            color: white;
            box-shadow: 0 4px 0 #d68910;
        }

        #action-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #d68910;
        }

        #action-btn.stop {
            background: var(--stop-color);
            box-shadow: 0 4px 0 #c0392b;
        }

        #action-btn.confirm {
            background: #3498db;
            box-shadow: 0 4px 0 #2980b9;
        }

        #reset-btn {
            background: #dcdde1;
            color: #7f8c8d;
            flex: 0.4;
            box-shadow: 0 4px 0 #bdc3c7;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        #log-container {
            margin-top: 15px;
            text-align: left;
            border-top: 2px solid var(--log-border);
            padding-top: 10px;
        }

        #log-title {
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 8px;
            display: block;
        }

        #log-list {
            max-height: 100px;
            overflow-y: auto;
            font-size: 13px;
            color: var(--text-muted);
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #log-list li {
            padding: 4px 8px;
            border-bottom: 1px solid var(--log-border);
            display: flex;
            justify-content: space-between;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 텍스트 롤링 애니메이션 수정 */
        @keyframes infiniteLoop {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-50%);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <button id="theme-toggle" onclick="toggleTheme()">🌙</button>
        <h1>챌린저스 서버 직업 룰렛</h1>
        <div id="counter">남은 직업: <span id="count-num">47</span> / 47</div>

        <div id="display-box">
            <div id="roulette-box">
                <div class="rotating-question" id="rotating-text"></div>
            </div>

            <img id="job-img" src="" alt="직업 이미지" onerror="this.onerror=null; this.src='img/물음표.png'">

            <div id="job-name">준비되셨나요?</div>
        </div>

        <div class="btn-group">
            <button id="action-btn" onclick="toggleSpin()">시작</button>
            <button id="reset-btn" onclick="resetAll()">리셋</button>
        </div>

        <div id="log-container">
            <span id="log-title">뽑힌 기록:</span>
            <ul id="log-list"></ul>
        </div>
    </div>

    <script>
        const originalJobList = [
            "히어로", "팔라딘", "다크나이트", "불독", "썬콜", "비숍", "보우마스터", "신궁", "패스파인더", "나이트로드", "섀도어", "듀얼블레이드", "바이퍼", "캡틴", "캐논슈터",
            "소울마스터", "플레임위자드", "윈드브레이커", "나이트워커", "스트라이커", "미하일",
            "블래스터", "배틀메이지", "와일드헌터", "메카닉", "데몬슬레이어", "데몬어벤져", "제논",
            "아란", "에반", "루미너스", "메르세데스", "팬텀", "은월",
            "카이저", "카인", "카데나", "엔젤릭버스터",
            "아델", "일리움", "칼리", "아크",
            "호영", "라라",
            "제로", "키네시스", "린"
        ];

        let jobs = [];
        let pickedHistory = [];
        let isSpinning = false;
        let isConfirming = false;
        let pickedJob = "";
        let soundInterval = null;

        const actionBtn = document.getElementById('action-btn');
        const jobNameDisplay = document.getElementById('job-name');
        const jobImgDisplay = document.getElementById('job-img');
        const countDisplay = document.getElementById('count-num');
        const logList = document.getElementById('log-list');
        const rouletteBox = document.getElementById('roulette-box');
        const rotatingText = document.getElementById('rotating-text');
        const themeToggleBtn = document.getElementById('theme-toggle');

        function initialize() {
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark-mode');
                themeToggleBtn.innerText = '☀️';
            }

            const savedJobs = localStorage.getItem('mapleJobs');
            const savedHistory = localStorage.getItem('mapleHistory');

            if (savedJobs && savedHistory) {
                jobs = JSON.parse(savedJobs);
                pickedHistory = JSON.parse(savedHistory);
                renderHistory();
            } else {
                jobs = [...originalJobList];
            }

            countDisplay.innerText = jobs.length;
            if (jobs.length === 0) {
                setCompleteState();
            }

            preloadImages();
            initRoulette();
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
                themeToggleBtn.innerText = '☀️';
            } else {
                localStorage.setItem('theme', 'light');
                themeToggleBtn.innerText = '🌙';
            }
        }

        function preloadImages() {
            originalJobList.forEach(job => {
                const img = new Image();
                img.src = `img/${job}.png`;
            });
            const defaultImg = new Image();
            defaultImg.src = 'img/물음표.png';
        }

        let audioCtx;

        function playSound(freq, type, duration, volume = 0.1) {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            try {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.log("오디오 재생 오류:", e);
            }
        }

        function startSpinSound() {
            soundInterval = setInterval(() => {
                playSound(150 + Math.random() * 80, 'sine', 0.05, 0.08);
            }, 60);
        }

        function stopSpinSound() {
            clearInterval(soundInterval);
        }

        function playReadySound() {
            playSound(220, 'triangle', 0.4, 0.15);
            setTimeout(() => playSound(330, 'triangle', 0.4, 0.15), 100);
        }

        function playFanfareSound() {
            playSound(523.25, 'sine', 0.15, 0.1);
            setTimeout(() => playSound(659.25, 'sine', 0.15, 0.1), 100);
            setTimeout(() => playSound(783.99, 'sine', 0.15, 0.1), 200);
            setTimeout(() => playSound(1046.50, 'sine', 0.5, 0.15), 300);
        }

        function initRoulette() {
            let html = '';
            originalJobList.forEach(job => {
                html += `<span>${job}</span>`;
            });
            rotatingText.innerHTML = html + html;
        }

        function toggleSpin() {
            if (jobs.length === 0) return;

            if (!isSpinning && !isConfirming) {
                isSpinning = true;
                actionBtn.innerText = "중지!";
                actionBtn.className = "stop";

                jobImgDisplay.style.display = "none";
                rouletteBox.style.display = "block";
                jobNameDisplay.innerText = "룰렛이 돌아갑니다...";
                jobNameDisplay.style.display = "block";

                startSpinSound();

            } else if (isSpinning) {
                isSpinning = false;
                isConfirming = true;

                actionBtn.innerText = "확인";
                actionBtn.className = "confirm";

                rouletteBox.style.display = "none";
                stopSpinSound();
                playReadySound();

                const finalIdx = Math.floor(Math.random() * jobs.length);
                pickedJob = jobs.splice(finalIdx, 1)[0];

                jobImgDisplay.src = "img/물음표.png";
                jobImgDisplay.style.display = "block";
                jobNameDisplay.innerText = "";

            } else if (isConfirming) {
                isConfirming = false;

                jobImgDisplay.src = `img/${pickedJob}.png`;
                jobImgDisplay.onerror = function () {
                    this.onerror = null;
                    this.src = 'img/물음표.png';
                };
                jobImgDisplay.style.display = "block";

                jobNameDisplay.innerText = pickedJob;
                jobNameDisplay.style.display = "block";

                playFanfareSound();
                saveAndRender(pickedJob);
                pickedJob = "";

                actionBtn.innerText = "시작";
                actionBtn.className = "";
            }
        }

        function saveAndRender(picked) {
            const time = new Date().toLocaleTimeString('ko-KR', { hour12: false });
            pickedHistory.unshift({ name: picked, time: time });

            localStorage.setItem('mapleJobs', JSON.stringify(jobs));
            localStorage.setItem('mapleHistory', JSON.stringify(pickedHistory));

            countDisplay.innerText = jobs.length;
            renderHistory();

            if (jobs.length === 0) {
                setCompleteState();
            }
        }

        function renderHistory() {
            logList.innerHTML = '';
            const total = originalJobList.length;
            pickedHistory.forEach((log, index) => {
                const li = document.createElement('li');
                const orderNum = total - (jobs.length + index);

                const span = document.createElement('span');
                span.innerHTML = `<strong>${orderNum}.</strong> ${log.name}`;

                const small = document.createElement('small');
                small.textContent = log.time;

                li.appendChild(span);
                li.appendChild(small);
                logList.appendChild(li);
            });
        }

        function setCompleteState() {
            actionBtn.disabled = true;
            actionBtn.innerText = "완료";
            jobImgDisplay.style.display = "none";
            jobNameDisplay.innerText = "모든 직업 완료!";
        }

        function resetAll() {
            if (confirm("모든 기록을 리셋하고 처음부터 다시 시작할까요? (테마 설정은 유지됩니다)")) {
                localStorage.removeItem('mapleJobs');
                localStorage.removeItem('mapleHistory');
                location.reload();
            }
        }

        window.onload = initialize;
    </script>
</body>

</html>
